name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCHEME: "FitGentlyNutrition"

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project FitGentlyNutrition.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            DEPLOYMENT_POSTPROCESSING=YES \
            STRIP_INSTALLED_PRODUCT=NO \
            2>&1 | tee build.log | grep -E "error:|Build succeeded|Build FAILED" || true
          grep -q "Build succeeded" build.log || { echo "--- FULL LOG ---"; cat build.log; exit 1; }

      - name: Find .app
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name '*.app' | head -n 1)"
          echo "Found: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "--- .app contents ---"
          ls -lh "$APP_PATH"

      - name: Verify Info.plist exists
        run: |
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist missing from .app"
            echo "Contents of .app:"
            find "$APP_PATH" -maxdepth 2 | head -40
            exit 1
          fi
          echo "Info.plist found ✓"

      - name: Package IPA
        run: |
          set -euxo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry FitGentlyNutrition-unsigned.ipa Payload
          ls -lh FitGentlyNutrition-unsigned.ipa

      - name: Delete old latest-build release
        run: gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest-build release
        run: |
          gh release create latest-build \
            --title "Latest Build" \
            --notes "Unsigned IPA — install via AltStore or Sideloadly. Built from commit ${{ github.sha }}." \
            FitGentlyNutrition-unsigned.ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
