name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select default Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Clear Xcode cache
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build app (unsigned)
        run: |
          set -euxo pipefail
          xcodebuild \
            -project FitGentlyNutrition.xcodeproj \
            -scheme FitGentlyNutrition \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ENABLE_ON_DEMAND_RESOURCES=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            clean build

      - name: Locate .app bundle
        id: locate
        run: |
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app produced" >&2
            find build -name '*.app' || true
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"

      - name: Package IPA
        run: |
          set -euxo pipefail
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.locate.outputs.app_path }}" Payload/
          zip -qry FitGentlyNutrition-unsigned.ipa Payload
          ls -lh FitGentlyNutrition-unsigned.ipa

      - name: Upload to GitHub Release
        run: |
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-build FitGentlyNutrition-unsigned.ipa \
            --title "Latest Build" \
            --notes "Unsigned IPA — install via AltStore or Sideloadly. Build #${{ github.run_number }} — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
