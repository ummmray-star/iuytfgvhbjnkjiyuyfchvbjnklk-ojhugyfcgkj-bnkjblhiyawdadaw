name: FitGentlyNutrition

options:
  bundleIdPrefix: com.fitgently
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true
  developmentLanguage: en
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES

targets:
  FitGentlyNutrition:
    type: application
    platform: iOS

    sources:
      - path: FitGentlyNutrition
        excludes:
          - "**/*.md"

    info:
      path: FitGentlyNutrition/Info.plist
      properties:
        CFBundleDisplayName: FitGently Nutrition
        CFBundleIdentifier: com.fitgently.nutrition
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "FitGently uses your camera to analyze meals and suggest nutrition feedback."
        NSHealthShareUsageDescription: "FitGently reads your step data and hydration from Apple Health."
        NSHealthUpdateUsageDescription: "FitGently writes your daily water intake to Apple Health."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitgently.nutrition
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: FitGentlyNutrition/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_ON_DEMAND_RESOURCES: NO

    entitlements:
      path: FitGentlyNutrition/FitGentlyNutrition.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records

    dependencies:
      []

schemes:
  FitGentlyNutrition:
    build:
      targets:
        FitGentlyNutrition: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
